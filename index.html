<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Profile Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="card-container">
    <article class="profile-card">
      <div class="avatar-wrapper">
        <img 
          src="images.jpeg" 
          alt="Profile portrait" 
          class="avatar"
        />
      </div>

      <h1 class="name">Sutapa</h1>
      <p class="role">Aspiring Full-Stack Developer</p>
      <p class="bio">
        Passionate about crafting fast web experiences with JavaScript, clean UI layouts, and scalable backends.
      </p>

      <button id="followBtn" class="btn follow-btn">Follow</button>

      <div class="social-links">
        <div class="social-links">
        <a href="https://github.com/sutapa97382"
         target="_blank" rel="noopener noreferrer"
          class="social-link">GitHub</a>

        <a href="https://www.linkedin.com/in/sutapa-maity-87975a24b/"
         target="_blank" rel="noopener noreferrer"
          class="social-link">LinkedIn</a>
          
        <a href="https://www.instagram.com/sutapa5576?stkn=MTA2dXdqeG8zYXZtcQ=="
         target="_blank" rel="noopener noreferrer"
          class="social-link">Instagram</a>
      </div>
        </div>
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
